<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI yordamchi — MedAiUz</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        html, body { height: 100%; }
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #111827;
            display: flex;
            flex-direction: column;
        }
        .header {
            padding: 16px 18px;
            background: white;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            gap: 12px;
            flex-shrink: 0;
        }
        .back-btn {
            border: none;
            background: #eff6ff;
            color: #2563eb;
            width: 38px;
            height: 38px;
            border-radius: 12px;
            font-size: 18px;
            cursor: pointer;
        }
        .header h1 { font-size: 16px; }
        .header p { font-size: 10px; color: #6b7280; margin-top: 2px; }

        .chat-area {
            flex: 1;
            overflow-y: auto;
            padding: 16px;
            max-width: 700px;
            width: 100%;
            margin: 0 auto;
        }

        .msg {
            max-width: 85%;
            margin-bottom: 12px;
            padding: 12px 14px;
            border-radius: 16px;
            font-size: 13px;
            line-height: 1.6;
            white-space: pre-wrap;
        }

        .msg.user {
            background: #2563eb;
            color: white;
            margin-left: auto;
            border-bottom-right-radius: 4px;
        }

        .msg.ai {
            background: white;
            border: 1px solid #e5e7eb;
            margin-right: auto;
            border-bottom-left-radius: 4px;
        }

        .msg.typing {
            background: white;
            border: 1px solid #e5e7eb;
            margin-right: auto;
            color: #6b7280;
            font-style: italic;
        }

        .welcome-msg {
            text-align: center;
            padding: 30px 20px;
            color: #6b7280;
        }

        .welcome-msg .icon {
            font-size: 42px;
            margin-bottom: 10px;
        }

        .welcome-msg h2 {
            font-size: 16px;
            color: #111827;
            margin-bottom: 6px;
        }

        .welcome-msg p {
            font-size: 12px;
            line-height: 1.5;
        }

        .input-bar {
            flex-shrink: 0;
            background: white;
            border-top: 1px solid #e5e7eb;
            padding: 12px 16px;
            display: flex;
            gap: 10px;
            max-width: 700px;
            width: 100%;
            margin: 0 auto;
        }

        .input-bar textarea {
            flex: 1;
            border: 1px solid #e5e7eb;
            border-radius: 14px;
            padding: 12px 14px;
            font-size: 13px;
            font-family: inherit;
            resize: none;
            max-height: 100px;
        }

        .input-bar textarea:focus {
            outline: none;
            border-color: #2563eb;
        }

        .send-btn {
            border: none;
            background: #2563eb;
            color: white;
            width: 46px;
            height: 46px;
            border-radius: 14px;
            font-size: 18px;
            flex-shrink: 0;
        }

        .send-btn:disabled {
            background: #9ca3af;
        }
    </style>
</head>
<body>

<header class="header">
    <button class="back-btn" onclick="goBack()">←</button>
    <div>
        <h1>🤖 AI yordamchi</h1>
        <p>Tibbiyot bo'yicha aqlli yordamchi</p>
    </div>
</header>

<main class="chat-area" id="chatArea">
    <div class="welcome-msg" id="welcomeMsg">
        <div class="icon">🤖</div>
        <h2>Salom! Men MedAiUz AI yordamchiman</h2>
        <p>Tibbiyot bo'yicha savolingizni yozing — men sizga yordam berishga harakat qilaman.</p>
    </div>
</main>

<div class="input-bar">
    <textarea
        id="userInput"
        rows="1"
        placeholder="Savolingizni yozing..."
        onkeydown="handleKeyDown(event)"
        oninput="autoResize(this)"
    ></textarea>
    <button class="send-btn" id="sendBtn" onclick="sendMessage()">➤</button>
</div>

<script>
const API_URL = "https://medaiuz-bot.onrender.com/api/chat";

const chatArea = document.getElementById("chatArea");
const userInput = document.getElementById("userInput");
const sendBtn = document.getElementById("sendBtn");
const welcomeMsg = document.getElementById("welcomeMsg");

let isSending = false;

function goBack() {
    window.location.href = "./index.html";
}

function autoResize(el) {
    el.style.height = "auto";
    el.style.height = el.scrollHeight + "px";
}

function handleKeyDown(e) {
    if (e.key === "Enter" && !e.shiftKey) {
        e.preventDefault();
        sendMessage();
    }
}

function addMessage(text, sender) {
    if (welcomeMsg) {
        welcomeMsg.remove();
    }
    const div = document.createElement("div");
    div.className = "msg " + sender;
    div.textContent = text;
    chatArea.appendChild(div);
    chatArea.scrollTop = chatArea.scrollHeight;
    return div;
}

async function sendMessage() {
    const text = userInput.value.trim();
    if (!text || isSending) return;

    isSending = true;
    sendBtn.disabled = true;

    addMessage(text, "user");
    userInput.value = "";
    userInput.style.height = "auto";

    const typingEl = document.createElement("div");
    typingEl.className = "msg typing";
    typingEl.textContent = "Yozmoqda...";
    chatArea.appendChild(typingEl);
    chatArea.scrollTop = chatArea.scrollHeight;

    try {
        const response = await fetch(API_URL, {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: text })
        });

        const data = await response.json();
        typingEl.remove();

        if (!response.ok) {
            addMessage("⚠️ " + (data.error || "Xatolik yuz berdi. Qayta urinib ko'ring."), "ai");
        } else {
            addMessage(data.reply, "ai");
        }

    } catch (error) {
        typingEl.remove();
        addMessage("⚠️ Serverga ulanib bo'lmadi. Internet aloqangizni tekshiring.", "ai");
    }

    isSending = false;
    sendBtn.disabled = false;
    userInput.focus();
}
</script>

</body>
</html>
