<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Testlar — MedAiUz</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #111827;
            padding-bottom: 40px;
        }
        .header {
            padding: 18px;
            background: white;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .back-btn {
            border: none;
            background: #eff6ff;
            color: #2563eb;
            width: 38px;
            height: 38px;
            border-radius: 12px;
            font-size: 18px;
            cursor: pointer;
        }
        .header h1 { font-size: 18px; }
        .container { max-width: 700px; margin: auto; padding: 18px; }

        .progress {
            font-size: 12px;
            color: #6b7280;
            margin-bottom: 10px;
        }

        .question-card {
            background: white;
            border-radius: 20px;
            padding: 22px;
            border: 1px solid #e5e7eb;
        }

        .question-card h2 {
            font-size: 16px;
            margin-bottom: 18px;
            line-height: 1.5;
        }

        .option {
            display: block;
            width: 100%;
            text-align: left;
            padding: 14px;
            border-radius: 14px;
            border: 1px solid #e5e7eb;
            background: white;
            margin-bottom: 10px;
            font-size: 13px;
        }

        .option.correct {
            background: #dcfce7;
            border-color: #22c55e;
        }

        .option.wrong {
            background: #fee2e2;
            border-color: #ef4444;
        }

        .next-btn {
            margin-top: 10px;
            width: 100%;
            padding: 14px;
            border: none;
            border-radius: 14px;
            background: #2563eb;
            color: white;
            font-weight: bold;
            font-size: 14px;
            display: none;
        }

        .result-card {
            background: white;
            border-radius: 20px;
            padding: 30px;
            text-align: center;
            border: 1px solid #e5e7eb;
        }

        .result-card h2 { font-size: 22px; margin-bottom: 10px; }
        .result-card p { font-size: 13px; color: #6b7280; margin-bottom: 20px; }
    </style>
</head>
<body>

<header class="header">
    <button class="back-btn" onclick="goBack()">←</button>
    <h1>🧠 Testlar</h1>
</header>

<main class="container" id="container">
    <div class="progress" id="progress"></div>
    <div id="quizArea"></div>
</main>

<script>
const questions = [
    {
        q: "Insonda nechta suyak bor?",
        options: ["206", "180", "220", "150"],
        correct: 0
    },
    {
        q: "Yurak nechta kamerali?",
        options: ["2", "3", "4", "5"],
        correct: 2
    },
    {
        q: "Qaysi organ qonni tozalaydi?",
        options: ["Jigar", "Buyrak", "Taloq", "O'pka"],
        correct: 1
    }
];

let current = 0;
let score = 0;
let answered = false;

function renderQuestion() {
    answered = false;
    const container = document.getElementById("quizArea");
    const q = questions[current];

    document.getElementById("progress").textContent =
        "Savol " + (current + 1) + " / " + questions.length;

    let html = '<div class="question-card"><h2>' + q.q + '</h2>';

    q.options.forEach((opt, i) => {
        html += '<button class="option" onclick="checkAnswer(' + i + ')">' + opt + '</button>';
    });

    html += '<button class="next-btn" id="nextBtn" onclick="nextQuestion()">Keyingi savol →</button></div>';

    container.innerHTML = html;
}

function checkAnswer(index) {
    if (answered) return;
    answered = true;

    const q = questions[current];
    const buttons = document.querySelectorAll(".option");

    buttons.forEach((btn, i) => {
        if (i === q.correct) btn.classList.add("correct");
        else if (i === index) btn.classList.add("wrong");
        btn.disabled = true;
    });

    if (index === q.correct) score++;

    document.getElementById("nextBtn").style.display = "block";
}

function nextQuestion() {
    current++;
    if (current < questions.length) {
        renderQuestion();
    } else {
        showResult();
    }
}

function showResult() {
    document.getElementById("progress").textContent = "";
    const container = document.getElementById("quizArea");
    container.innerHTML =
        '<div class="result-card">' +
        '<h2>🎉 Test tugadi!</h2>' +
        '<p>Natija: ' + score + ' / ' + questions.length + ' to\'g\'ri javob</p>' +
        '<button class="next-btn" style="display:block" onclick="restart()">Qayta boshlash</button>' +
        '</div>';
}

function restart() {
    current = 0;
    score = 0;
    renderQuestion();
}

function goBack() {
    window.location.href = "./index.html";
}

renderQuestion();
</script>

</body>
</html>
