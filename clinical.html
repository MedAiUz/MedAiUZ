<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Klinik holatlar — MedAiUz</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #111827;
            padding-bottom: 40px;
        }
        .header {
            padding: 18px;
            background: white;
            border-bottom: 1px solid #e5e7eb;
            display: flex;
            align-items: center;
            gap: 12px;
        }
        .back-btn {
            border: none;
            background: #eff6ff;
            color: #2563eb;
            width: 38px;
            height: 38px;
            border-radius: 12px;
            font-size: 18px;
            cursor: pointer;
        }
        .header h1 { font-size: 18px; }
        .container { max-width: 900px; margin: auto; padding: 18px; }
        .case-list { display: flex; flex-direction: column; gap: 12px; }
        .case-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 18px;
            padding: 16px;
            text-align: left;
            width: 100%;
            cursor: pointer;
        }
        .case-card h3 { font-size: 14px; margin-bottom: 6px; }
        .case-card p { font-size: 11px; color: #6b7280; line-height: 1.5; }
        .tag {
            display: inline-block;
            margin-top: 8px;
            padding: 3px 8px;
            border-radius: 8px;
            background: #eff6ff;
            color: #2563eb;
            font-size: 9px;
            font-weight: bold;
        }
    </style>
</head>
<body>

<header class="header">
    <button class="back-btn" onclick="goBack()">←</button>
    <h1>🩻 Klinik holatlar</h1>
</header>

<main class="container">
    <div class="case-list">

        <button class="case-card" onclick="openCase(1)">
            <h3>38 yoshli bemor, o'tkir qorin og'rig'i</h3>
            <p>Bemor o'ng pastki qorin sohasida kuchli og'riq bilan murojaat qildi. Tashxis qo'yish uchun tahlil qiling.</p>
            <span class="tag">Jarrohlik</span>
        </button>

        <button class="case-card" onclick="openCase(2)">
            <h3>55 yoshli bemor, ko'krak qafasida og'riq</h3>
            <p>Bemorda nafas qisishi va ko'krak og'rig'i kuzatilmoqda. Differensial tashxisni belgilang.</p>
            <span class="tag">Kardiologiya</span>
        </button>

        <button class="case-card" onclick="openCase(3)">
            <h3>6 yoshli bola, yuqori harorat</h3>
            <p>Bolada 3 kundan beri yuqori harorat va toshmalar mavjud. Mumkin bo'lgan sabablarni aniqlang.</p>
            <span class="tag">Pediatriya</span>
        </button>

    </div>
</main>

<script>
function goBack() {
    window.location.href = "./index.html";
}
function openCase(id) {
    alert("🩻 Klinik holat #" + id + "\n\nTo'liq tahlil va savol-javob rejimi tez orada qo'shiladi.");
}
</script>

</body>
</html>
