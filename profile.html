<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Profil — MedAiUz</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #111827;
            padding-bottom: 90px;
        }

        button {
            font-family: inherit;
            cursor: pointer;
        }

        .header {
            padding: 20px 18px 15px;
            background: white;
            border-bottom: 1px solid #e5e7eb;
        }

        .header-row {
            max-width: 900px;
            margin: auto;
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back-btn {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            border: 1px solid #e5e7eb;
            background: white;
            color: #111827;
            font-size: 18px;
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .header-row h1 {
            font-size: 19px;
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 18px;
        }

        .profile-hero {
            background: linear-gradient(135deg, #2563eb, #1d4ed8);
            color: white;
            border-radius: 24px;
            padding: 26px 22px;
            margin-bottom: 20px;
            text-align: center;
        }

        .avatar {
            width: 78px;
            height: 78px;
            border-radius: 50%;
            background: rgba(255, 255, 255, .18);
            border: 3px solid rgba(255, 255, 255, .5);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
            font-weight: bold;
            margin: 0 auto 12px;
        }

        .profile-hero h2 {
            font-size: 20px;
            margin-bottom: 4px;
        }

        .profile-hero p {
            font-size: 12.5px;
            opacity: .9;
            margin-bottom: 12px;
        }

        .role-tag {
            display: inline-block;
            background: rgba(255, 255, 255, .18);
            padding: 5px 12px;
            border-radius: 999px;
            font-size: 11.5px;
            font-weight: bold;
        }

        .edit-btn {
            margin-top: 16px;
            width: 100%;
            border: none;
            border-radius: 14px;
            padding: 13px;
            background: white;
            color: #2563eb;
            font-weight: bold;
            font-size: 13.5px;
        }

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 10px;
            margin-bottom: 20px;
        }

        .stat-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 16px;
            padding: 14px 6px;
            text-align: center;
        }

        .stat-card .num {
            font-size: 18px;
            font-weight: bold;
            color: #2563eb;
        }

        .stat-card .lbl {
            font-size: 10px;
            color: #6b7280;
            margin-top: 3px;
            line-height: 1.3;
        }

        .section-title {
            font-size: 12px;
            font-weight: bold;
            color: #6b7280;
            text-transform: uppercase;
            letter-spacing: .05em;
            margin: 20px 0 10px;
        }

        .list {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 18px;
            overflow: hidden;
        }

        .row {
            width: 100%;
            display: flex;
            align-items: center;
            gap: 12px;
            padding: 14px;
            background: white;
            border: none;
            border-bottom: 1px solid #e5e7eb;
            text-align: left;
        }

        .row:last-child {
            border-bottom: none;
        }

        .row-icon {
            width: 36px;
            height: 36px;
            border-radius: 11px;
            background: #eff6ff;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 17px;
            flex-shrink: 0;
        }

        .row-text {
            flex: 1;
        }

        .row-title {
            font-size: 13.5px;
            font-weight: bold;
        }

        .row-sub {
            font-size: 10.5px;
            color: #6b7280;
            margin-top: 2px;
        }

        .row-chev {
            color: #9ca3af;
            font-size: 16px;
        }

        .row.danger .row-title {
            color: #dc2626;
        }

        .row.danger .row-icon {
            background: #fee2e2;
        }

        .bottom-nav {
            position: fixed;
            bottom: 0;
            left: 0;
            right: 0;
            height: 70px;
            background: rgba(255, 255, 255, .97);
            backdrop-filter: blur(12px);
            border-top: 1px solid #e5e7eb;
            display: flex;
            justify-content: space-around;
            align-items: center;
            z-index: 100;
        }

        .nav-btn {
            border: none;
            background: transparent;
            color: #6b7280;
            font-size: 10px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 4px;
        }

        .nav-btn span {
            font-size: 22px;
        }

        .nav-btn.active {
            color: #2563eb;
            font-weight: bold;
        }
    
        .saved-overlay{display:none;position:fixed;inset:0;background:rgba(17,24,39,.5);z-index:300;align-items:flex-end;justify-content:center}
        .saved-modal{width:100%;max-width:900px;max-height:82vh;overflow:auto;background:#fff;border-top-left-radius:24px;border-top-right-radius:24px;padding:20px}
        .saved-modal-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:15px}
        .saved-modal-head h3{font-size:17px}.saved-close{border:0;background:#eff6ff;border-radius:11px;width:36px;height:36px;font-size:18px}
        .saved-item{display:flex;align-items:center;gap:10px;padding:12px;border:1px solid #e5e7eb;border-radius:14px;margin-bottom:9px}
        .saved-icon{font-size:22px}.saved-info{flex:1;min-width:0}.saved-info strong{display:block;font-size:12px}.saved-info span{display:block;font-size:10px;color:#6b7280;margin-top:3px}
        .saved-actions{display:flex;gap:6px}.saved-actions button{border:0;border-radius:9px;padding:8px;font-size:11px}
        .saved-read{background:#2563eb;color:#fff}.saved-share{background:#ffedd5;color:#9a3412}.saved-delete{background:#fee2e2;color:#991b1b}
        .saved-empty{text-align:center;padding:30px 10px;color:#6b7280;font-size:12px}

    </style>
</head>

<body>

<header class="header">
    <div class="header-row">
        <button class="back-btn" onclick="goHome()">←</button>
        <h1>Profil</h1>
    </div>
</header>

<main class="container">

    <section class="profile-hero">
        <div class="avatar" id="avatarInitials">AZ</div>
        <h2 id="profileName">Foydalanuvchi</h2>
        <p id="profileEmail">Ma'lumot kiritilmagan</p>
        <span class="role-tag">🎓 <span id="profileRole">Talaba</span></span>
        <button class="edit-btn" onclick="openEdit()">✎ Profilni tahrirlash</button>
    </section>

    <section class="stats">
        <div class="stat-card">
            <div class="num" id="statTests">0</div>
            <div class="lbl">Testlar<br>topshirildi</div>
        </div>
        <div class="stat-card">
            <div class="num" id="statAvg">—</div>
            <div class="lbl">O'rtacha<br>ball</div>
        </div>
        <div class="stat-card">
            <div class="num" id="statStreak">0</div>
            <div class="lbl">Kunlik<br>seriya</div>
        </div>
    </section>

    <div class="section-title">Hisob</div>
    <section class="list">
        <button class="row" onclick="openResults()">
            <div class="row-icon">📊</div>
            <div class="row-text">
                <div class="row-title">Mening natijalarim</div>
                <div class="row-sub">Test va o'qish tarixi</div>
            </div>
            <div class="row-chev">›</div>
        </button>
        <button class="row" onclick="openSavedMaterials()">
            <div class="row-icon">🔖</div>
            <div class="row-text">
                <div class="row-title">Saqlangan materiallar</div>
                <div class="row-sub">Darslik va holatlar</div>
            </div>
            <div class="row-chev">›</div>
        </button>
    </section>

    <div class="section-title">Sozlamalar</div>
    <section class="list">
        <button class="row" onclick="alert('Til tanlash keyingi bosqichda qo\'shiladi.')">
            <div class="row-icon">🌐</div>
            <div class="row-text">
                <div class="row-title">Til</div>
                <div class="row-sub">O'zbekcha</div>
            </div>
            <div class="row-chev">›</div>
        </button>
    </section>

    <div class="section-title">&nbsp;</div>
    <section class="list">
        <button class="row danger" onclick="alert('Tizimdan chiqish keyingi bosqichda qo\'shiladi.')">
            <div class="row-icon">🚪</div>
            <div class="row-text">
                <div class="row-title">Chiqish</div>
            </div>
        </button>
    </section>

</main>

<div id="savedOverlay" class="saved-overlay" onclick="closeSavedByBackdrop(event)">
    <div class="saved-modal">
        <div class="saved-modal-head">
            <h3>💾 Saqlangan materiallar</h3>
            <button class="saved-close" onclick="closeSavedMaterials()">×</button>
        </div>
        <div id="savedMaterialsList"></div>
    </div>
</div>


<!-- Profilni tahrirlash oynasi -->
<div id="editOverlay" style="display:none; position:fixed; inset:0; background:rgba(17,24,39,.5); align-items:flex-end; justify-content:center; z-index:200;">
    <div style="width:100%; max-width:900px; background:white; border-top-left-radius:24px; border-top-right-radius:24px; padding:22px 20px 26px;">
        <h3 style="font-size:17px; margin-bottom:16px;">Profilni tahrirlash</h3>

        <div style="margin-bottom:14px;">
            <label style="display:block; font-size:12px; color:#6b7280; margin-bottom:6px;">Ism va familiya</label>
            <input type="text" id="inputName" style="width:100%; padding:11px 12px; border:1px solid #e5e7eb; border-radius:12px; font-size:14px; font-family:inherit;">
        </div>

        <div style="margin-bottom:14px;">
            <label style="display:block; font-size:12px; color:#6b7280; margin-bottom:6px;">Email</label>
            <input type="email" id="inputEmail" placeholder="misol@email.com" style="width:100%; padding:11px 12px; border:1px solid #e5e7eb; border-radius:12px; font-size:14px; font-family:inherit;">
        </div>

        <div style="margin-bottom:18px;">
            <label style="display:block; font-size:12px; color:#6b7280; margin-bottom:6px;">Maqom</label>
            <select id="inputRole" style="width:100%; padding:11px 12px; border:1px solid #e5e7eb; border-radius:12px; font-size:14px; font-family:inherit;">
                <option>1-kurs talabasi</option>
                <option>2-kurs talabasi</option>
                <option>3-kurs talabasi</option>
                <option>4-kurs talabasi</option>
                <option>5-kurs talabasi</option>
                <option>6-kurs talabasi</option>
                <option>Shifokor</option>
            </select>
        </div>

        <div style="display:flex; gap:10px;">
            <button onclick="closeEdit()" style="flex:1; padding:12px; border-radius:12px; font-weight:bold; font-size:14px; border:1px solid #e5e7eb; background:white; color:#111827;">Bekor qilish</button>
            <button onclick="saveEdit()" style="flex:1; padding:12px; border-radius:12px; font-weight:bold; font-size:14px; border:none; background:#2563eb; color:white;">Saqlash</button>
        </div>
    </div>
</div>

<nav class="bottom-nav">
    <button class="nav-btn" onclick="goHome()">
        <span>🏠</span>
        Bosh sahifa
    </button>
    <button class="nav-btn" onclick="openBooks()">
        <span>📚</span>
        Darsliklar
    </button>
    <button class="nav-btn" onclick="openAI()">
        <span>🤖</span>
        AI
    </button>
    <button class="nav-btn active" onclick="">
        <span>👤</span>
        Profil
    </button>
</nav>

<script>
    const tg = window.Telegram && window.Telegram.WebApp;
    if (tg) tg.ready();

    let state = {
        name: "Foydalanuvchi",
        email: "",
        role: "Talaba"
    };

    function initials(name) {
        return name.trim().split(/\s+/).map(w => w[0]).join("").slice(0, 2).toUpperCase();
    }

    function renderProfile() {
        document.getElementById('profileName').textContent = state.name;
        document.getElementById('profileEmail').textContent = state.email || "Email kiritilmagan";
        document.getElementById('profileRole').textContent = state.role;
        document.getElementById('avatarInitials').textContent = initials(state.name);
    }

    // ---- Saqlash: Telegram ichida bo'lsa CloudStorage (Telegram serverida,
    // qurilma/qayta kirish bilan yo'qolmaydi), aks holda oddiy localStorage ----
    function saveProfile() {
        const json = JSON.stringify(state);
        if (tg && tg.CloudStorage) {
            tg.CloudStorage.setItem("medaiuz_profile", json, function () {});
        } else {
            localStorage.setItem("medaiuz_profile", json);
        }
    }

    function loadProfile(callback) {
        function fillFromTelegramIfNeeded() {
            if (tg && tg.initDataUnsafe && tg.initDataUnsafe.user) {
                const user = tg.initDataUnsafe.user;
                const tgName = [user.first_name, user.last_name].filter(Boolean).join(" ");
                if (tgName) state.name = tgName;
                if (user.username) state.email = "@" + user.username;
                saveProfile();
            }
        }

        if (tg && tg.CloudStorage) {
            tg.CloudStorage.getItem("medaiuz_profile", function (err, value) {
                if (!err && value) {
                    try { state = JSON.parse(value); } catch (e) { fillFromTelegramIfNeeded(); }
                } else {
                    fillFromTelegramIfNeeded();
                }
                callback();
            });
        } else {
            const saved = JSON.parse(localStorage.getItem("medaiuz_profile") || "null");
            if (saved) {
                state = saved;
            } else {
                fillFromTelegramIfNeeded();
            }
            callback();
        }
    }

    function openEdit() {
        document.getElementById('inputName').value = state.name;
        document.getElementById('inputEmail').value = state.email;
        document.getElementById('inputRole').value = state.role;
        document.getElementById('editOverlay').style.display = "flex";
    }

    function closeEdit() {
        document.getElementById('editOverlay').style.display = "none";
    }

    function saveEdit() {
        const newName = document.getElementById('inputName').value.trim();
        const newEmail = document.getElementById('inputEmail').value.trim();
        const newRole = document.getElementById('inputRole').value;

        if (newName) state.name = newName;
        state.email = newEmail;
        state.role = newRole;

        saveProfile();
        renderProfile();
        closeEdit();
    }


    // ==================================================
    // SAQLANGAN MATERIALAR — books.html bilan bir xil kalit
    // ==================================================
    function savedStorageKey() {
        const user = tg && tg.initDataUnsafe && tg.initDataUnsafe.user;
        return user && user.id
            ? "medaiuz_saved_materials_" + user.id
            : "medaiuz_saved_materials_guest";
    }

    function getSavedMaterials() {
        try {
            return JSON.parse(localStorage.getItem(savedStorageKey()) || "[]");
        } catch (e) {
            return [];
        }
    }

    function setSavedMaterials(list) {
        localStorage.setItem(savedStorageKey(), JSON.stringify(list));
    }

    function openSavedMaterials() {
        renderSavedMaterials();
        document.getElementById("savedOverlay").style.display = "flex";
    }

    function closeSavedMaterials() {
        document.getElementById("savedOverlay").style.display = "none";
    }

    function closeSavedByBackdrop(event) {
        if (event.target.id === "savedOverlay") closeSavedMaterials();
    }

    function renderSavedMaterials() {
        const box = document.getElementById("savedMaterialsList");
        const list = getSavedMaterials();
        box.innerHTML = "";

        if (!list.length) {
            box.innerHTML =
                '<div class="saved-empty">📚 Hozircha saqlangan material yo‘q.<br><br>Darslikdan 💾 Saqlash tugmasini bosing.</div>';
            return;
        }

        list.forEach(function(item, index) {
            const row = document.createElement("div");
            row.className = "saved-item";
            row.innerHTML =
                '<div class="saved-icon">📕</div>' +
                '<div class="saved-info">' +
                    '<strong>' + escapeSaved(item.name) + '</strong>' +
                    '<span>' + escapeSaved(item.subject || "Darslik") + '</span>' +
                '</div>' +
                '<div class="saved-actions">' +
                    '<button class="saved-read">📖</button>' +
                    '<button class="saved-share">📤</button>' +
                    '<button class="saved-delete">🗑️</button>' +
                '</div>';

            row.querySelector(".saved-read").onclick = function() {
                if (item.url) window.open(item.url, "_blank");
            };

            row.querySelector(".saved-share").onclick = async function() {
                if (!item.url) return;
                const url = new URL(item.url, location.href).href;

                if (navigator.share) {
                    try {
                        await navigator.share({
                            title: "MedAiUz — " + item.name,
                            text: "📚 " + item.name,
                            url: url
                        });
                        return;
                    } catch (e) {}
                }

                window.open(
                    "https://t.me/share/url?url=" +
                    encodeURIComponent(url) +
                    "&text=" +
                    encodeURIComponent("📚 " + item.name),
                    "_blank"
                );
            };

            row.querySelector(".saved-delete").onclick = function() {
                const current = getSavedMaterials();
                current.splice(index, 1);
                setSavedMaterials(current);
                renderSavedMaterials();
            };

            box.appendChild(row);
        });
    }

    function escapeSaved(value) {
        return String(value || "").replace(/[&<>"']/g, function(m) {
            return {
                "&":"&amp;",
                "<":"&lt;",
                ">":"&gt;",
                '"':"&quot;",
                "'":"&#039;"
            }[m];
        });
    }

    function openBooks() {
        window.location.href = "books.html";
    }

    function openAI() {
        window.location.href = "ai.html";
    }

    function openResults() {
        window.location.href = "results.html";
    }

    // ---- Haqiqiy statistikani localStorage'dan hisoblash ----
    function loadStats() {
        const results = JSON.parse(localStorage.getItem("medaiuz_results") || "[]");

        const testsCount = results.length;
        document.getElementById('statTests').textContent = testsCount;

        if (testsCount > 0) {
            const avgPct = Math.round(
                results.reduce((sum, r) => sum + r.pct, 0) / testsCount
            );
            document.getElementById('statAvg').textContent = avgPct + "%";
        } else {
            document.getElementById('statAvg').textContent = "—";
        }

        document.getElementById('statStreak').textContent = calcStreak(results);
    }

    // Ketma-ket necha kun test yechilganini hisoblaydi (bugundan orqaga)
    function calcStreak(results) {
        if (results.length === 0) return 0;

        const days = new Set(
            results.map(r => new Date(r.date).toDateString())
        );

        let streak = 0;
        let cursor = new Date();

        while (days.has(cursor.toDateString())) {
            streak++;
            cursor.setDate(cursor.getDate() - 1);
        }

        return streak;
    }

    function goHome() {
        window.location.href = "index.html";
    }

    loadProfile(function () {
        renderProfile();
        loadStats();
    });
</script>

</body>
</html>
