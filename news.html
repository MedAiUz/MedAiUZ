<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Yangiliklar — MedAiUz</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #111827;
            padding-bottom: 40px;
        }

        .header {
            position: sticky;
            top: 0;
            z-index: 10;

            padding: 16px 18px;

            background: rgba(255,255,255,0.95);
            backdrop-filter: blur(10px);

            border-bottom: 1px solid #e5e7eb;

            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back-btn {
            border: none;
            background: #eff6ff;
            color: #2563eb;

            width: 40px;
            height: 40px;

            border-radius: 12px;

            font-size: 19px;

            cursor: pointer;
        }

        .header-title {
            flex: 1;
        }

        .header h1 {
            font-size: 18px;
            margin-bottom: 3px;
        }

        .header p {
            font-size: 11px;
            color: #6b7280;
        }

        .refresh-btn {
            border: none;
            background: #eff6ff;
            color: #2563eb;

            width: 40px;
            height: 40px;

            border-radius: 12px;

            font-size: 18px;

            cursor: pointer;
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 18px;
        }

        .status-card {
            background: white;

            border: 1px solid #e5e7eb;
            border-radius: 18px;

            padding: 14px 16px;

            margin-bottom: 16px;

            font-size: 12px;
            color: #6b7280;
        }

        .status-card strong {
            color: #111827;
        }

        .news-list {
            display: flex;
            flex-direction: column;
            gap: 14px;
        }

        .news-card {
            background: white;

            border: 1px solid #e5e7eb;
            border-radius: 20px;

            overflow: hidden;

            box-shadow: 0 4px 14px rgba(15, 23, 42, 0.04);
        }

        .news-image {
            width: 100%;
            max-height: 360px;

            object-fit: cover;

            display: block;
        }

        .news-content {
            padding: 17px;
        }

        .news-date {
            font-size: 10px;
            color: #6b7280;

            margin-bottom: 8px;
        }

        .news-title {
            font-size: 17px;
            line-height: 1.4;

            margin-bottom: 10px;

            color: #111827;
        }

        .news-text {
            font-size: 13px;
            line-height: 1.65;

            color: #4b5563;

            white-space: pre-line;

            margin-bottom: 15px;
        }

        .news-actions {
            display: flex;
            gap: 8px;
        }

        .telegram-btn {
            flex: 1;

            border: none;

            background: #2563eb;
            color: white;

            padding: 12px;

            border-radius: 13px;

            font-size: 12px;
            font-weight: bold;

            cursor: pointer;
        }

        .empty-card {
            background: white;

            border: 1px solid #e5e7eb;
            border-radius: 20px;

            padding: 35px 20px;

            text-align: center;
        }

        .empty-icon {
            font-size: 42px;
            margin-bottom: 12px;
        }

        .empty-card h2 {
            font-size: 17px;
            margin-bottom: 7px;
        }

        .empty-card p {
            font-size: 12px;
            color: #6b7280;
            line-height: 1.5;
        }

        .loading {
            text-align: center;

            padding: 40px 20px;

            color: #6b7280;

            font-size: 13px;
        }

        .error-card {
            background: #fff1f2;

            border: 1px solid #fecdd3;
            border-radius: 18px;

            padding: 18px;

            text-align: center;

            color: #be123c;

            font-size: 12px;
            line-height: 1.5;
        }

        .retry-btn {
            margin-top: 12px;

            border: none;

            background: #e11d48;
            color: white;

            padding: 10px 18px;

            border-radius: 12px;

            font-size: 12px;
            font-weight: bold;

            cursor: pointer;
        }

        @media (min-width: 700px) {

            .news-list {
                display: grid;

                grid-template-columns:
                    repeat(2, minmax(0, 1fr));
            }

            .news-card {
                height: 100%;
            }
        }
    </style>
</head>

<body>

<header class="header">

    <button
        class="back-btn"
        onclick="goBack()"
    >
        ←
    </button>

    <div class="header-title">

        <h1>📰 Yangiliklar</h1>

        <p>
            MedAiUz yangiliklar kanali
        </p>

    </div>

    <button
        class="refresh-btn"
        onclick="loadNews()"
        title="Yangilash"
    >
        🔄
    </button>

</header>


<main class="container">

    <div class="status-card">

        <strong>📢 @MedAiUz_NEWS</strong>

        <br>

        Eng so‘nggi tibbiy va MedAiUz
        yangiliklari shu yerda.

    </div>


    <div id="newsArea">

        <div class="loading">
            📰 Yangiliklar yuklanmoqda...
        </div>

    </div>

</main>


<script>

/* ==================================================
   MEDAIUZ NEWS API
   ================================================== */

const API_URL =
    "https://medaiuz-bot.onrender.com";


/* ==================================================
   ORQAGA QAYTISH
   ================================================== */

function goBack() {

    window.location.href =
        "./index.html";

}


/* ==================================================
   SANANI FORMATLASH
   ================================================== */

function formatDate(dateString) {

    try {

        const date =
            new Date(dateString);

        return date.toLocaleString(
            "uz-UZ",
            {
                day: "2-digit",
                month: "2-digit",
                year: "numeric",

                hour: "2-digit",
                minute: "2-digit"
            }
        );

    } catch (error) {

        return "";

    }

}


/* ==================================================
   HTML XAVFSIZLIGI
   ================================================== */

function escapeHtml(text) {

    if (!text) {
        return "";
    }

    return String(text)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* ==================================================
   YANGILIKNI OCHISH
   ================================================== */

function openTelegram(url) {

    if (!url) {
        return;
    }

    window.open(
        url,
        "_blank"
    );

}


/* ==================================================
   BIRTA YANGILIK
   ================================================== */

function createNewsCard(news) {

    const title =
        escapeHtml(
            news.title ||
            "MedAiUz yangiliklari"
        );

    const text =
        escapeHtml(
            news.text || ""
        );

    const date =
        formatDate(
            news.date
        );

    let imageHtml = "";

    if (
        news.imageFileId
    ) {

        const imageUrl =
            API_URL +
            "/api/news/image/" +
            encodeURIComponent(
                news.imageFileId
            );

        imageHtml = `
            <img
                class="news-image"
                src="${imageUrl}"
                alt="${title}"
                loading="lazy"
                onerror="this.style.display='none'"
            >
        `;

    }

    return `

        <article class="news-card">

            ${imageHtml}

            <div class="news-content">

                <div class="news-date">
                    📅 ${date}
                </div>

                <h2 class="news-title">
                    ${title}
                </h2>

                ${
                    text
                        ? `
                            <div class="news-text">
                                ${text}
                            </div>
                        `
                        : ""
                }

                <div class="news-actions">

                    <button
                        class="telegram-btn"
                        onclick="openTelegram('${news.telegramUrl || ""}')"
                    >
                        📢 Telegramda ko‘rish
                    </button>

                </div>

            </div>

        </article>

    `;

}


/* ==================================================
   YANGILIKLARNI CHIQARISH
   ================================================== */

function renderNews(news) {

    const newsArea =
        document.getElementById(
            "newsArea"
        );

    if (
        !news ||
        !Array.isArray(news) ||
        news.length === 0
    ) {

        newsArea.innerHTML = `

            <div class="empty-card">

                <div class="empty-icon">
                    📰
                </div>

                <h2>
                    Hozircha yangilik yo‘q
                </h2>

                <p>
                    @MedAiUz_NEWS kanaliga
                    yangi post joylanganda
                    u shu yerda avtomatik
                    paydo bo‘ladi.
                </p>

            </div>

        `;

        return;
    }


    newsArea.innerHTML = `

        <div class="news-list">

            ${

                news
                    .map(
                        item =>
                            createNewsCard(
                                item
                            )
                    )
                    .join("")

            }

        </div>

    `;

}


/* ==================================================
   YANGILIKLARNI YUKLASH
   ================================================== */

async function loadNews() {

    const newsArea =
        document.getElementById(
            "newsArea"
        );


    newsArea.innerHTML = `

        <div class="loading">
            📰 Yangiliklar yuklanmoqda...
        </div>

    `;


    try {

        const response =
            await fetch(
                API_URL +
                "/api/news",
                {
                    method: "GET",

                    cache: "no-store"
                }
            );


        if (!response.ok) {

            throw new Error(
                "Server javob bermadi."
            );

        }


        const data =
            await response.json();


        if (
            !data.success
        ) {

            throw new Error(
                "Yangiliklar API xatosi."
            );

        }


        renderNews(
            data.news
        );


    } catch (error) {

        console.error(
            "Yangiliklar xatosi:",
            error
        );


        newsArea.innerHTML = `

            <div class="error-card">

                ❌ Yangiliklarni yuklab bo‘lmadi.

                <br>

                Internet yoki server
                aloqasini tekshiring.

                <br>

                <button
                    class="retry-btn"
                    onclick="loadNews()"
                >
                    🔄 Qayta urinish
                </button>

            </div>

        `;

    }

}


/* ==================================================
   AVTOMATIK YANGILASH
   ================================================== */

setInterval(
    loadNews,
    60000
);


/* ==================================================
   BOSHLANGANDA YUKLASH
   ================================================== */

loadNews();

</script>

</body>
</html>
