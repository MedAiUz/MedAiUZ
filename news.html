<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Yangiliklar — MedAiUz</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f7fb;
            color: #111827;
            padding-bottom: 40px;
        }

        .header {
            position: sticky;
            top: 0;
            z-index: 100;

            background: white;
            border-bottom: 1px solid #e5e7eb;

            padding: 15px 18px;

            display: flex;
            align-items: center;
            gap: 12px;
        }

        .back-btn,
        .refresh-btn {
            width: 40px;
            height: 40px;

            border: none;
            border-radius: 12px;

            background: #eff6ff;
            color: #2563eb;

            font-size: 19px;
            cursor: pointer;
        }

        .header-title {
            flex: 1;
        }

        .header-title h1 {
            font-size: 18px;
            margin-bottom: 3px;
        }

        .header-title p {
            font-size: 11px;
            color: #6b7280;
        }

        .container {
            max-width: 900px;
            margin: auto;
            padding: 18px;
        }

        .status {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 18px;
            padding: 15px;
            margin-bottom: 15px;
            font-size: 12px;
            line-height: 1.6;
        }

        .status strong {
            color: #111827;
        }

        .loading,
        .empty,
        .error {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 18px;
            padding: 30px 20px;
            text-align: center;
        }

        .loading {
            color: #6b7280;
        }

        .empty-icon {
            font-size: 40px;
            margin-bottom: 10px;
        }

        .empty h2 {
            font-size: 17px;
            margin-bottom: 8px;
        }

        .empty p {
            color: #6b7280;
            font-size: 12px;
            line-height: 1.6;
        }

        .error {
            color: #be123c;
            background: #fff1f2;
            border-color: #fecdd3;
        }

        .news-list {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .news-card {
            background: white;
            border: 1px solid #e5e7eb;
            border-radius: 20px;
            overflow: hidden;
        }

        .news-image {
            width: 100%;
            max-height: 420px;
            object-fit: cover;
            display: block;
        }

        .news-body {
            padding: 18px;
        }

        .news-date {
            font-size: 10px;
            color: #6b7280;
            margin-bottom: 8px;
        }

        .news-title {
            font-size: 17px;
            line-height: 1.45;
            margin-bottom: 10px;
        }

        .news-text {
            font-size: 13px;
            line-height: 1.65;
            color: #4b5563;
            white-space: pre-line;
            margin-bottom: 15px;
        }

        .telegram-btn {
            width: 100%;
            padding: 13px;

            border: none;
            border-radius: 13px;

            background: #2563eb;
            color: white;

            font-size: 13px;
            font-weight: bold;

            cursor: pointer;
        }

        .debug {
            margin-top: 15px;
            background: #111827;
            color: #d1fae5;

            border-radius: 14px;
            padding: 14px;

            font-family: monospace;
            font-size: 11px;

            white-space: pre-wrap;
            word-break: break-word;

            display: none;
        }

        @media (min-width: 700px) {
            .news-list {
                display: grid;
                grid-template-columns: 1fr 1fr;
            }
        }
    </style>
</head>

<body>

<header class="header">

    <button
        class="back-btn"
        onclick="goBack()"
    >
        ←
    </button>

    <div class="header-title">
        <h1>📰 Yangiliklar</h1>
        <p>MedAiUz yangiliklar kanali</p>
    </div>

    <button
        class="refresh-btn"
        onclick="loadNews()"
    >
        🔄
    </button>

</header>


<main class="container">

    <div class="status">
        📢 <strong>@MedAiUz_NEWS</strong>
        <br>
        MedAiUz'dagi eng so‘nggi yangiliklar.
    </div>

    <div id="newsArea">

        <div class="loading">
            📰 Yangiliklar yuklanmoqda...
        </div>

    </div>

    <div
        id="debug"
        class="debug"
    ></div>

</main>


<script>

const API_URL =
    "https://medaiuz-bot.onrender.com";


/* ==========================================
   ORQAGA
========================================== */

function goBack() {

    window.location.href =
        "./index.html";

}


/* ==========================================
   HTML XAVFSIZLIGI
========================================== */

function escapeHtml(value) {

    if (
        value === null ||
        value === undefined
    ) {
        return "";
    }

    return String(value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");

}


/* ==========================================
   SANA
========================================== */

function formatDate(value) {

    if (!value) {
        return "";
    }

    const date =
        new Date(value);

    if (
        Number.isNaN(
            date.getTime()
        )
    ) {
        return "";
    }

    return date.toLocaleString(
        "uz-UZ",
        {
            day: "2-digit",
            month: "2-digit",
            year: "numeric",
            hour: "2-digit",
            minute: "2-digit"
        }
    );

}


/* ==========================================
   DEBUG
========================================== */

function showDebug(message) {

    const debug =
        document.getElementById(
            "debug"
        );

    debug.style.display =
        "block";

    debug.textContent =
        message;

}


/* ==========================================
   TELEGRAM
========================================== */

function openTelegram(url) {

    if (!url) {
        return;
    }

    window.open(
        url,
        "_blank"
    );

}


/* ==========================================
   NEWS CARD
========================================== */

function createNewsCard(item) {

    const title =
        escapeHtml(
            item.title ||
            "MedAiUz yangiliklari"
        );

    const text =
        escapeHtml(
            item.text || ""
        );

    const date =
        formatDate(
            item.date
        );


    let imageHtml = "";


    if (
        item.imageFileId
    ) {

        const imageUrl =
            API_URL +
            "/api/news/image/" +
            encodeURIComponent(
                item.imageFileId
            );

        imageHtml = `

            <img
                class="news-image"
                src="${imageUrl}"
                alt="${title}"
            >

        `;

    }


    const telegramUrl =
        item.telegramUrl ||
        "";


    return `

        <article class="news-card">

            ${imageHtml}

            <div class="news-body">

                <div class="news-date">
                    📅 ${date}
                </div>

                <h2 class="news-title">
                    ${title}
                </h2>

                ${
                    text
                        ? `
                            <div class="news-text">
                                ${text}
                            </div>
                        `
                        : ""
                }

                <button
                    class="telegram-btn"
                    onclick='openTelegram(${JSON.stringify(telegramUrl)})'
                >
                    📢 Telegramda ko‘rish
                </button>

            </div>

        </article>

    `;

}


/* ==========================================
   NEWS CHIQARISH
========================================== */

function renderNews(items) {

    const area =
        document.getElementById(
            "newsArea"
        );


    if (
        !Array.isArray(items) ||
        items.length === 0
    ) {

        area.innerHTML = `

            <div class="empty">

                <div class="empty-icon">
                    📰
                </div>

                <h2>
                    Hozircha yangilik yo‘q
                </h2>

                <p>
                    @MedAiUz_NEWS kanaliga
                    yangi post yuborilganda
                    shu yerda ko‘rinadi.
                </p>

            </div>

        `;

        return;
    }


    area.innerHTML = `

        <div class="news-list">

            ${
                items
                    .map(
                        item =>
                            createNewsCard(item)
                    )
                    .join("")
            }

        </div>

    `;

}


/* ==========================================
   NEWS YUKLASH
========================================== */

async function loadNews() {

    const area =
        document.getElementById(
            "newsArea"
        );


    area.innerHTML = `

        <div class="loading">
            📰 Yangiliklar yuklanmoqda...
        </div>

    `;


    showDebug(
        "Serverga ulanmoqda..."
    );


    try {

        const url =
            API_URL +
            "/api/news?t=" +
            Date.now();


        const response =
            await fetch(
                url,
                {
                    method: "GET",
                    cache: "no-store"
                }
            );


        showDebug(
            "API javobi: HTTP " +
            response.status
        );


        if (!response.ok) {

            throw new Error(
                "HTTP " +
                response.status
            );

        }


        const data =
            await response.json();


        showDebug(
            "API muvaffaqiyatli.\n" +
            "success: " +
            data.success +
            "\nchannel: " +
            data.channel +
            "\ncount: " +
            data.count
        );


        console.log(
            "MEDAIUZ NEWS:",
            data
        );


        if (
            !data.success
        ) {

            throw new Error(
                "API success=false"
            );

        }


        renderNews(
            data.news
        );


    } catch (error) {

        console.error(
            "MEDAIUZ NEWS ERROR:",
            error
        );


        showDebug(
            "XATO:\n" +
            error.message
        );


        area.innerHTML = `

            <div class="error">

                ❌ Yangiliklarni yuklab bo‘lmadi.

                <br><br>

                ${escapeHtml(
                    error.message
                )}

                <br><br>

                <button
                    class="telegram-btn"
                    onclick="loadNews()"
                >
                    🔄 Qayta urinish
                </button>

            </div>

        `;

    }

}


/* ==========================================
   START
========================================== */

loadNews();


/* ==========================================
   AVTOMATIK YANGILASH
========================================== */

setInterval(
    loadNews,
    60000
);

</script>

</body>
</html>
